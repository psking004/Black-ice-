name: Bug report
description: Report a reproducible defect in BLACK ICE.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, personal data, private logs, or third-party target details. Use synthetic examples."
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the commit SHA or package version.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include synthetic inputs and exact commands; do not execute hostile code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and checks
      description: Python/Node versions and relevant test output.
    validations:
      required: false
