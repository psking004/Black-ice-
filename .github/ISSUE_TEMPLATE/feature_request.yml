name: Feature request
description: Propose a bounded BLACK ICE capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Do not propose unrestricted agent access as a substitute for an independently enforced boundary."
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Enforcement boundary and failure mode
      description: Which component enforces this, and what happens if it is unavailable?
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and limitations
    validations:
      required: true
